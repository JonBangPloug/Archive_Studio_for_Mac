[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivestudio"
version = "1.1"
description = "Focused desktop tool for historical document transcription and OCR/HTR correction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jon" }]

dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "platformdirs>=4.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
archivestudio = "archivestudio.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/archivestudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
